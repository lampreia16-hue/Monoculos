name: Monitor de Monóculos Térmicos

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - name: Descarregar repositório
        uses: actions/checkout@v5

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Instalar dependências
        run: pip install requests beautifulsoup4 curl_cffi

      - name: Executar monitor
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python monitor.py

      - name: Guardar anúncios vistos
        run: |
          git config user.name "Monitor Bot"
          git config user.email "bot@users.noreply.github.com"
          git add anuncios_vistos.json
          git diff --staged --quiet || (git commit -m "Atualizar anúncios vistos" && git push)
